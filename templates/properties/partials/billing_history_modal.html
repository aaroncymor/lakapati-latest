<dialog class="modal" id="billingHistoryModal" {% if open_modal %} x-init="$el.showModal()" {% endif %}>
    <div class="modal-box  w-11/12 max-w-5xl">
        <h3 class="font-bold text-2xl text-center">Billing History</h3>
        <div class="divider"></div>
        <div id="billingHistoryScroll" class="max-h-64 overflow-y-auto">
            <h4 class="font-bold text-md">Water Billing Records</h4>
            <ul id="billingHistoryList" class="list bg-base-100 rounded-box shadow-md">
                {% include 'properties/partials/billing_history_rows.html' %}
            </ul>
        </div>
        <div class="modal-action justify-start">
            <button type="button" class="btn" @click="$el.closest('dialog').close()">
                Close
            </button>
        </div>
    </div>
</dialog>
