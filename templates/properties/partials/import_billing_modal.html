<dialog class="modal" id="importBillingFormModal">
  <div class="modal-box">
    <form id="importBillingForm" hx-post="{% url 'import_water_billings' %}" hx-target="#uploadResult"
      hx-swap="innerHTML" hx-encoding="multipart/form-data" hx-indicator="#uploadSpinner"
      class="relative border-2 border-dashed border-slate-300 rounded-xl p-8 text-center bg-slate-50 hover:bg-slate-100 hover:border-indigo-500 transition-all cursor-pointer group"
      onclick="document.getElementById('fileInput').click()">
      {% csrf_token %}
      <!-- Upload Icon & Instructions -->
      <div class="flex flex-col items-center justify-center space-y-3 pointer-events-none">
        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-full group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
        </div>
        <div class="text-sm">
          <span class="font-medium text-indigo-600">Click to upload</span>
          <span class="text-slate-500">or drag and drop</span>
        </div>
        <p class="text-xs text-slate-400">Excel file only</p>
      </div>

      <!-- Hidden File Input -->
      <input type="file" id="fileInput" name="file" class="hidden"
        onchange="htmx.trigger('#importBillingForm', 'submit')" />
    </form>
    <!-- Upload Progress Spinner (HTMX Indicator) -->
    <div id="uploadSpinner"
      class="htmx-indicator mt-4 flex items-center justify-center text-sm text-indigo-600 font-medium">
      <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      Uploading...
    </div>

    <!-- Upload Status Target -->
    <div id="uploadResult" class="mt-4"></div>
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>
