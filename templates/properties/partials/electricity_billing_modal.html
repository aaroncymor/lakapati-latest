<dialog class="modal" id="electricityBillingFormModal" {% if open_modal %} x-init="$el.showModal()" {% endif %} x-data="electricityBillingForm({
        cycleStartDate: '{{ cycle_start_date|default:'' }}',
        cycleEndDate: '{{ cycle_end_date|default:'' }}',
        prevUsageMinLimit: {{ current_usage|default:0 }},
        prevUsage: {{ previous_usage|default:0 }},
        currUsage: {{ current_usage|default:0 }},
        prevTotalMinLimit: {{ current_total|default:0 }},
        prevTotal: {{ previous_total|default:0 }},
        currTotal: {{ current_total|default:0 }},
        costPerElectricityUsage: {{ cost_per_electricity_usage|default:0 }},
        commonUsagePerHead: {{ common_usage_per_head|default:0 }},
        fixedWaterFee: {{ fixed_water_fee|default:0 }},
        multiplyByHeadCount: {{ multiply_by_head_count|yesno:'true,false' }},
        headCount: {{ head_count|default:0 }}
    })">
    <div class="modal-box">
        <h3 class="font-bold text-center text-lg">Electricity Billing</h3>
        <div class="divider"></div>
        <div class="tenant_group_info">
            <p x-text="`Tenant Group: ${activeTenantGroup.name}`"></p>
            <p x-text="`Primary Tenant: ${activeTenantGroup.primary}`"></p>
            <p x-text="`Property Space: ${activeTenantGroup.propertySpace}`"></p>
            <p x-text="`Multiple Occupants: ${activeTenantGroup.hasMultipleTenants ? 'Yes' : 'No'}`"></p>
        </div>
        <form hx-post="{% url 'create_electricity_billing' %}" hx-target="#electricityBillingFormModal"
            hx-swap="outerHTML"
            hx-on::after-request="if (event.detail.xhr.status === 204) this.closest('dialog').close()"
            class="w-full pt-5">
            <fieldset class="fieldset">
                <label class="input">
                    <span class="label">Cycle Start Date</span>
                    <input type="date" name="start_date" class="input validator" placeholder="Start date"
                        style="width: inherit;" x-model="cycleStartDate" />
                </label>
            </fieldset>
            <fieldset class="fieldset">
                <label class="input">
                    <span class="label">Cycle End Date</span>
                    <input type="date" name="end_date" class="input validator" placeholder="End date"
                        style="width: inherit;" x-model="cycleEndDate" />
                </label>
            </fieldset>

            <div class="divider"></div>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="previous_total" class="input validator"
                        :placeholder="`Previous total usage`" :min="prevTotalMinLimit" x-model.number="prevTotal"
                        style="width: inherit;" step="0.01" />
                    <span>Previous total usage</span>
                    <p class="validator-hint"
                        x-text="`Must be greater than or equal current total (latest: ${prevTotalMinLimit})`">
                    </p>
                </label>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="current_total" class="input validator"
                        :placeholder="`Current total usage (min: ${prevTotal})`" :min="prevTotal"
                        x-model.number="currTotal" style="width: inherit;" step="0.01" />
                    <span>Current total usage</span>
                    <p class="validator-hint"
                        x-text="`Must be greater than or equal previous total (latest: ${prevTotal})`">
                    </p>
                </label>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="stored_cost_per_electricity_usage" class="input validator"
                        placeholder="Cost Per Electricity Usage" min="0" x-model.number="costPerElectricityUsage"
                        style="width: inherit;" required />
                    <span>Cost Per Electricity Usage</span>
                    <p class="validator-hint">Must not be below zero</p>
                </label>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="previous_usage" class="input validator"
                        :placeholder="`Previous usage (min: ${prevUsageMinLimit})`" :min="prevUsageMinLimit"
                        x-model.number="prevUsage" style="width: inherit;" required step="0.01" />
                    <span>Previous usage</span>
                    <p class="validator-hint"
                        x-text="`Must be greater than or equal current usage (latest: ${prevUsageMinLimit})`">
                    </p>
                </label>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="current_usage" class="input validator"
                        :placeholder="`Current usage (min: ${prevUsage})`" :min="prevUsage" x-model.number="currUsage"
                        style="width: inherit;" required step="0.01" />
                    <span>Current usage</span>
                    <p class="validator-hint"
                        x-text="`Must be greater than or equal your previous usage (latest: ${prevUsage})`">
                    </p>
                </label>
            </fieldset>

            <fieldset class="fieldset flex flex-row items-center mt-7">
                <input type="checkbox" name="stored_multiply_by_head_count" class="checkbox checkbox-md"
                    x-model="multiplyByHeadCount" />
                <span>Multiply by Head Count</span>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="stored_common_usage_per_head" class="input validator"
                        :placeholder="`Common usage per head`" x-model.number="commonUsagePerHead"
                        style="width: inherit;" required />
                    <span>Common usage per head</span>
                    <p class="validator-hint">
                        Enter the common usage per head
                    </p>
                </label>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="stored_fixed_water_fee" class="input validator"
                        :placeholder="`Fixed water fee`" x-model.number="fixedWaterFee" style="width: inherit;" required
                        step="0.01" />
                    <span>Fixed water fee</span>
                    <p class="validator-hint">
                        Must not be below zero
                    </p>
                </label>
            </fieldset>

            <fieldset class="fieldset">
                <label class="floating-label flex flex-col">
                    <input type="number" name="stored_head_count" class="input validator" :placeholder="`Head count`"
                        x-model.number="headCount" style="width: inherit;" required />
                    <span>Head count</span>
                    <p class="validator-hint">
                        Must not be below zero
                    </p>
                </label>
            </fieldset>

            <div class="electricity_billing_modal summary mt-7">
                <div class="flex flex-row">
                    <p>
                        <span>Cost Per Electricity Usage x Electricity Usage Diff:</span>
                        <span x-text="electricityUsageDiff"></span>
                        <span>x</span>
                        <span x-text="costPerElectricityUsage"></span>
                        <span>=</span>
                        <span x-text="electricityUsageDiffAndCostPerElectricityUsageProduct"></span>
                    </p>
                </div>
                <div class="flex flex-row">
                    <template x-if="multiplyByHeadCount === true">
                        <p>
                            <span>Common Usage Per Head x Head Count:</span>
                            <span x-text="commonUsagePerHead"></span>
                            <span>x</span>
                            <span x-text="headCount"></span>
                            <span>=</span>
                            <span x-text="commonUsagePerHeadFinal"></span>
                        </p>
                    </template>
                    <template x-if="multiplyByHeadCount === false">
                        <p>
                            <span>Common Usage Per Head:</span>
                            <span x-text="commonUsagePerHead"></span>
                        </p>
                    </template>
                </div>
                <div class="flex flex-row">
                    <template x-if="multiplyByHeadCount === true">
                        <p>
                            <span>Fixed Water Fee x Head Count:</span>
                            <span x-text="fixedWaterFee"></span>
                            <span>x</span>
                            <span x-text="headCount"></span>
                            <span>=</span>
                            <span x-text="fixedWaterFeeFinal"></span>
                        </p>
                    </template>
                    <template x-if="multiplyByHeadCount === false">
                        <p>
                            <span>Fixed Water Fee:</span>
                            <span x-text="fixedWaterFee"></span>
                        </p>
                    </template>
                </div>
                <div class="flex flex-row">
                    <p>
                        <span>Total Electricity Bill:</span>
                        <span class="font-bold" x-text="finalAmount"></span>
                    </p>
                </div>
            </div>

            <input type="hidden" name="stored_final_amount" :value="finalAmount">
            <input type="hidden" name="tenant_group_id" :value="activeTenantGroup.id">

            <div class="modal-action flex justify-end">
                <!-- Submit button -->
                <button type="submit" class="btn btn-primary">Submit</button>
                <!-- Close button -->
                <button type="button" class="btn" @click="$el.closest('dialog').close()">
                    Close
                </button>
            </div>
        </form>
    </div>
</dialog>
