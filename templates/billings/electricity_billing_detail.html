{% extends "base.html" %}

{% block xtra_head %}
<!-- html2canvas-pro: maintained fork that supports modern CSS color functions (oklch, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.11/dist/html2canvas-pro.min.js"
    integrity="sha384-Wm+alMbg1fxSJBbLMXKBb1ZfoWBd0FwJml5aEbKolDB41cMjTfek0cLKgCku6MAF" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
{% endblock %}

{% block content %}
<div class="mb-4">
    <button id="download-image-btn" class="btn btn-primary">Download Image</button>
</div>
<div class="mx-8 mt-8">
    {% include 'billings/partials/electricity_invoice.html' with consumption=electricity_consumption %}
</div>
{% endblock %}

{% block xtra_script %}
<script>
    const downloadImageBtn = document.getElementById('download-image-btn');
    downloadImageBtn.addEventListener('click', async function () {
        const element = document.querySelector('.billing-invoice-capture');
        downloadImageBtn.disabled = true;
        try {
            // html2canvas-pro understands oklch(), so no color neutralizing needed.
            const canvas = await html2canvas(element, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
            });
            const link = document.createElement('a');
            // link.download = element.dataset.filename || 'electricity-billing-' + '{{ electricity_consumption.tenant_group.name }}_{{ electricity_consumption.start_date|date:"Y-m-d" }}-{{ electricity_consumption.end_date|date:"Y-m-d" }}.png';
            link.download = '{{ electricity_consumption.billing_filename }}.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (err) {
            console.error('Image generation failed:', err);
        } finally {
            downloadImageBtn.disabled = false;
        }
    });
</script>
{% endblock %}
